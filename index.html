<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #fafafa;
      color: #111;
      padding: 20px;
    }
    main {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid #eaeaea;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Form */
    input[type="email"] {
      width: 100%;
      font-size: 15px;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      transition: border-color .2s;
      background: #fafafa;
    }
    input[type="email"]:focus {
      border-color: #111;
      background: #fff;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 0;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all .15s ease;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:active { transform: scale(0.99); }
    .btn-primary {
      background: #111;
      color: #fff;
    }
    .btn-primary:hover { background: #262626; }
    .btn-cta {
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      margin-top: 14px;
    }
    .btn-cta:hover { background: #1d4ed8; }
    .btn-outline {
      background: #fff;
      color: #111;
      border: 1px solid #ddd;
    }
    .btn-outline:hover {
      border-color: #999;
      background: #fafafa;
    }
    .btn-ghost {
      background: transparent;
      color: #777;
      font-size: 13px;
      padding: 8px 0;
    }
    .btn-ghost:hover { color: #111; }

    .mt-sm { margin-top: 10px; }
    .mt-md { margin-top: 16px; }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .badge-active { background: #ecfdf5; color: #059669; }
    .badge-inactive { background: #f3f4f6; color: #6b7280; }

    /* User Header */
    .user-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 18px;
    }
    .user-email {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Valid Info */
    .valid-info {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
    }

    /* Price Section */
    .price-grid {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .plan-card {
      flex: 1;
      background: #fafafa;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
      transition: all .15s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
      outline: none;
    }
    .plan-card:hover {
      border-color: #aaa;
    }
    .plan-card.active {
      background: #fff;
      border-color: #111;
      box-shadow: 0 0 0 1px #111;
    }
    .plan-name {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }
    .plan-price {
      font-size: 14px;
      font-weight: 700;
      color: #111;
    }

    /* Account Card */
    .account-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }
    .account-guide {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 8px;
    }
    .account-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #1f2937;
      word-break: break-all;
      background: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color .15s;
    }
    .account-value:hover { border-color: #111; }
    .account-value::after {
      content: "复制";
      font-size: 11px;
      color: #6b7280;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin-left: 8px;
    }

    /* Hint text */
    .hint {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      margin-top: 10px;
    }

    /* Toast */
    #msg {
      font-size: 13px;
      color: #666;
      min-height: 1.4em;
      margin-top: 16px;
      text-align: center;
    }

    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 20px 0 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Transfer</div>

    <!-- 登录表单 -->
    <form id="login">
      <input type="email" id="email" placeholder="输入邮箱继续" required autofocus>
      <button class="btn btn-primary mt-sm" type="submit">获取登录链接</button>
      <p class="hint" style="text-align:center;">免密登录，链接将发送至你的邮箱</p>
    </form>

    <!-- 会员看板 -->
    <div id="me" hidden>
      <div class="user-header">
        <span class="user-email" id="who"></span>
        <span id="statusBadge" class="badge badge-inactive">未开通 Claude 账户</span>
      </div>

      <!-- 未开通：购买区域 -->
      <div id="pricingSection">
        <p style="font-size: 13px; font-weight: 500; color: #4b5563;">选择开通方案</p>
        <div class="price-grid">
          <button id="planOnce" type="button" class="plan-card active">
            <span class="plan-name">30 天单次</span>
            <span class="plan-price">$35</span>
          </button>
          <button id="planMonth" type="button" class="plan-card">
            <span class="plan-name">按月续费</span>
            <span class="plan-price">$35/月</span>
          </button>
        </div>
        <button id="btnPay" class="btn btn-primary mt-md" type="button">点击付款开通 Claude 账户</button>
        <p class="hint" style="text-align:center;">付款后立即为你分配专属账号进入 Claude</p>
      </div>

      <!-- 已开通：交付区域 -->
      <div id="activeSection" hidden>
        <div id="validUntil" class="valid-info"></div>

        <div class="account-card">
          <div class="account-guide">请使用下方账号在 Claude 官网登录：</div>
          <div class="account-value" id="alias" title="点击复制账号"></div>
        </div>

        <a id="btnClaude" class="btn btn-cta" href="https://claude.ai/login" target="_blank" rel="noopener noreferrer">进入 Claude</a>
        <button id="portal" class="btn btn-outline mt-sm" hidden>管理订阅</button>
      </div>

      <div class="divider"></div>
      <button id="logout" class="btn btn-ghost">退出登录</button>
    </div>

    <p id="msg"></p>
  </main>

  <script>
    const API = "https://api.buyai.win";
    const $ = id => document.getElementById(id);
    const post = (path, body) => fetch(API + path, { method: "POST", body: JSON.stringify(body) }).then(r => r.json());
    const fmtDate = ms => new Date(ms).toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
    const toast = (t, dur = 3000) => {
      $("msg").textContent = t;
      if (dur) setTimeout(() => { if ($("msg").textContent === t) $("msg").textContent = ""; }, dur);
    };

    async function loadMe() {
      const session = localStorage.getItem("session");
      if (!session) return null;
      const r = await post("/me", { session });
      if (r.error) return null;

      $("alias").textContent = r.alias;

      if (r.active) {
        $("statusBadge").textContent = "已开通 Claude 账户";
        $("statusBadge").className = "badge badge-active";
        $("validUntil").textContent = `会员有效期至 ${fmtDate(r.until)}`;
        $("pricingSection").hidden = true;
        $("activeSection").hidden = false;
        $("portal").hidden = !r.hasSub;
      } else {
        $("statusBadge").textContent = "未开通 Claude 账户";
        $("statusBadge").className = "badge badge-inactive";
        $("pricingSection").hidden = false;
        $("activeSection").hidden = true;
      }
      return r;
    }

    async function pay(plan) {
      toast("正在跳转收银台…", 0);
      const r = await post("/pay", { session: localStorage.getItem("session"), plan });
      if (r.url) location.href = r.url;
      else toast(r.error || "创建支付失败");
    }

    async function finishSso(session) {
      const raw = sessionStorage.getItem("sso");
      if (!raw) return;
      const sso = JSON.parse(raw);
      toast("正在校验 Claude Team 授权…", 0);
      const r = await post("/sso/assert", { session, reqId: sso.reqId, relay: sso.relay });
      if (!r.samlResponse) {
        if (!r.needPay) sessionStorage.removeItem("sso");
        toast(r.error || "SSO 授权失败");
        return;
      }
      sessionStorage.removeItem("sso");
      const form = document.createElement("form");
      form.method = "POST";
      form.action = r.acs;
      for (const [k, v] of [["SAMLResponse", r.samlResponse], ["RelayState", r.relay]]) {
        const inp = document.createElement("input");
        inp.type = "hidden";
        inp.name = k;
        inp.value = v;
        form.append(inp);
      }
      document.body.append(form);
      form.submit();
    }

    async function pollPaid() {
      toast("支付成功，正在同步会员状态…", 0);
      for (let i = 0; i < 5; i++) {
        const me = await loadMe();
        if (me?.active) {
          toast("会员已成功开通！", 3000);
          return;
        }
        await new Promise(r => setTimeout(r, 1500));
      }
      toast("已收到支付，若未立即更新请刷新页面");
    }

    function render() {
      const email = localStorage.getItem("email");
      const session = localStorage.getItem("session");
      $("login").hidden = !!email;
      $("me").hidden = !email;
      $("who").textContent = email || "";
      if (email && session) {
        loadMe();
        if (sessionStorage.getItem("sso")) finishSso(session);
      }
    }

    // 事件绑定
    $("login").onsubmit = async e => {
      e.preventDefault();
      toast("发送中…", 0);
      const r = await post("/send", { email: $("email").value });
      toast(r.ok ? "登录链接已发送，请查收邮箱（10分钟内有效）" : (r.error || "发送失败"));
    };

    // 方案选择与付款
    let selectedPlan = "once";
    $("planOnce").onclick = () => {
      selectedPlan = "once";
      $("planOnce").classList.add("active");
      $("planMonth").classList.remove("active");
    };
    $("planMonth").onclick = () => {
      selectedPlan = "month";
      $("planMonth").classList.add("active");
      $("planOnce").classList.remove("active");
    };
    $("btnPay").onclick = () => pay(selectedPlan);

    $("portal").onclick = async () => {
      toast("正在打开订阅管理…", 0);
      const r = await post("/portal", { session: localStorage.getItem("session") });
      if (r.url) location.href = r.url;
      else toast(r.error || "无法打开订阅管理");
    };

    $("alias").onclick = () => {
      navigator.clipboard.writeText($("alias").textContent).then(() => toast("账号已复制到剪贴板 ✓", 2000));
    };

    $("btnClaude").onclick = () => {
      if ($("alias").textContent) {
        navigator.clipboard.writeText($("alias").textContent);
      }
    };

    $("logout").onclick = () => {
      localStorage.clear();
      sessionStorage.clear();
      $("msg").textContent = "";
      render();
    };

    // 初始化路由参数
    const hash = new URLSearchParams(location.hash.slice(1));
    const token = hash.get("token");
    if (hash.has("sso")) {
      sessionStorage.setItem("sso", JSON.stringify({ reqId: hash.get("sso") || "", relay: hash.get("relay") || "" }));
      history.replaceState(null, "", location.pathname + location.search);
    }
    const paid = new URLSearchParams(location.search).get("paid");
    if (paid) history.replaceState(null, "", "/");

    if (token) {
      history.replaceState(null, "", "/");
      post("/verify", { token }).then(r => {
        if (r.session) {
          localStorage.setItem("session", r.session);
          localStorage.setItem("email", r.email);
          toast("登录成功", 2000);
        } else {
          toast(r.error || "登录失败");
        }
        render();
      });
    } else {
      render();
      if (paid && localStorage.getItem("session")) pollPaid();
    }
  </script>
</body>
</html>
