<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fafafa; color: #1a1a1a; }
    main { width: 100%; max-width: 400px; padding: 32px 20px; }

    /* header */
    .logo { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 32px; }

    /* form */
    input[type="email"] { width: 100%; font-size: 15px; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; outline: none; transition: border-color .2s; background: #fff; }
    input[type="email"]:focus { border-color: #1a1a1a; }

    /* buttons */
    .btn { display: block; width: 100%; font-size: 14px; font-weight: 500; padding: 11px 0; border: none; border-radius: 10px; cursor: pointer; transition: opacity .15s; text-align: center; }
    .btn:active { opacity: .7; }
    .btn-primary { background: #1a1a1a; color: #fff; }
    .btn-outline { background: transparent; color: #1a1a1a; border: 1.5px solid #e0e0e0; }
    .btn-ghost { background: transparent; color: #888; font-size: 13px; padding: 8px 0; }

    /* spacing */
    .mt-sm { margin-top: 8px; }
    .mt-md { margin-top: 12px; }
    .mt-lg { margin-top: 24px; }

    /* badge */
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .badge-active { background: #e8f5e9; color: #2e7d32; }
    .badge-inactive { background: #f5f5f5; color: #999; }

    /* user header */
    .user-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .user-email { font-size: 14px; color: #555; }

    /* pricing row */
    .price-row { display: flex; gap: 8px; }
    .price-row .btn { flex: 1; }

    /* alias box */
    .alias-box { background: #fff; border: 1.5px solid #e0e0e0; border-radius: 10px; padding: 12px 14px; font-size: 13px; font-family: "SF Mono", "Fira Code", monospace; color: #333; word-break: break-all; cursor: pointer; position: relative; transition: border-color .2s; }
    .alias-box:hover { border-color: #1a1a1a; }
    .alias-box::after { content: "点击复制"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #aaa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    /* section */
    .section { margin-top: 28px; }
    .section-label { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

    /* mails */
    .mail-item { background: #fff; border: 1.5px solid #e0e0e0; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: border-color .2s; }
    .mail-item:hover { border-color: #1a1a1a; }
    .mail-item summary { font-size: 14px; font-weight: 500; list-style: none; }
    .mail-item summary::-webkit-details-marker { display: none; }
    .mail-meta { font-size: 12px; color: #999; margin-top: 4px; }
    .mail-body { font-size: 13px; color: #555; white-space: pre-wrap; word-break: break-word; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; line-height: 1.6; }

    /* toast */
    #msg { font-size: 13px; color: #888; min-height: 1.4em; margin-top: 16px; text-align: center; transition: opacity .2s; }
    #msg:empty { opacity: 0; }

    /* divider */
    .divider { height: 1px; background: #eee; margin: 20px 0; }

    /* plan valid */
    .valid-until { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Transfer</div>

    <!-- login -->
    <form id="login">
      <input type="email" id="email" placeholder="your@email.com" required>
      <button class="btn btn-primary mt-sm" type="submit">发送登录链接</button>
    </form>

    <!-- dashboard -->
    <div id="me" hidden>
      <div class="user-header">
        <span class="user-email" id="who"></span>
        <span id="statusBadge" class="badge badge-inactive">未开通</span>
      </div>
      <div id="validUntil" class="valid-until" hidden></div>

      <!-- pricing -->
      <div id="pricingSection">
        <div class="price-row">
          <button id="payOnce" class="btn btn-primary">30 天 · $35</button>
          <button id="payMonth" class="btn btn-outline">月付 · $35/月</button>
        </div>
      </div>
      <button id="portal" class="btn btn-outline mt-sm" hidden>管理订阅</button>

      <!-- inbox -->
      <div class="section">
        <div class="section-label">收信邮箱</div>
        <div class="alias-box" id="alias" role="button" tabindex="0"></div>
      </div>

      <div class="section">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="section-label" style="margin-bottom:0;">收件箱</span>
          <button id="refresh" class="btn-ghost" style="width:auto;padding:4px 0;">刷新</button>
        </div>
        <div id="mails" class="mt-sm"></div>
      </div>

      <div class="divider"></div>
      <button id="logout" class="btn btn-ghost">退出登录</button>
    </div>

    <p id="msg"></p>
  </main>

  <script>
    const API = "https://api.buyai.win";
    const $ = id => document.getElementById(id);
    const post = (path, body) => fetch(API + path, { method: "POST", body: JSON.stringify(body) }).then(r => r.json());
    const fmtDate = ms => new Date(ms).toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
    const toast = (t, dur) => { $("msg").textContent = t; if (dur) setTimeout(() => { if ($("msg").textContent === t) $("msg").textContent = ""; }, dur); };

    async function loadMe() {
      const session = localStorage.getItem("session");
      if (!session) return null;
      const r = await post("/me", { session });
      if (r.error) return null;
      $("alias").textContent = r.alias;
      if (r.active) {
        $("statusBadge").textContent = "已开通";
        $("statusBadge").className = "badge badge-active";
        $("validUntil").textContent = `有效期至 ${fmtDate(r.until)}`;
        $("validUntil").hidden = false;
        $("pricingSection").hidden = true;
      } else {
        $("statusBadge").textContent = "未开通";
        $("statusBadge").className = "badge badge-inactive";
        $("validUntil").hidden = true;
        $("pricingSection").hidden = false;
      }
      $("portal").hidden = !r.hasSub;
      return r;
    }

    async function loadMails() {
      const session = localStorage.getItem("session");
      if (!session) return;
      const r = await post("/mails", { session });
      if (r.error) { toast(r.error); return; }
      $("alias").textContent = r.alias;
      const box = $("mails");
      if (!r.mails.length) { box.innerHTML = '<p style="font-size:13px;color:#bbb;text-align:center;padding:20px 0;">暂无邮件</p>'; return; }
      box.replaceChildren(...r.mails.map(m => {
        const d = document.createElement("details");
        d.className = "mail-item";
        const s = document.createElement("summary");
        s.textContent = m.subject;
        const meta = document.createElement("div");
        meta.className = "mail-meta";
        meta.textContent = `${m.from} · ${m.date}`;
        const pre = document.createElement("div");
        pre.className = "mail-body";
        pre.textContent = m.body;
        d.append(s, meta, pre);
        return d;
      }));
    }

    async function pay(plan) {
      toast("正在跳转…");
      const r = await post("/pay", { session: localStorage.getItem("session"), plan });
      if (r.url) location.href = r.url;
      else toast(r.error || "创建支付失败");
    }

    async function finishSso(session) {
      const raw = sessionStorage.getItem("sso");
      if (!raw) return;
      const sso = JSON.parse(raw);
      toast("正在验证授权…");
      const r = await post("/sso/assert", { session, reqId: sso.reqId, relay: sso.relay });
      if (!r.samlResponse) {
        if (!r.needPay) sessionStorage.removeItem("sso");
        toast(r.error || "SSO 授权失败");
        return;
      }
      sessionStorage.removeItem("sso");
      const form = document.createElement("form");
      form.method = "POST";
      form.action = r.acs;
      for (const [k, v] of [["SAMLResponse", r.samlResponse], ["RelayState", r.relay]]) {
        const inp = document.createElement("input");
        inp.type = "hidden"; inp.name = k; inp.value = v;
        form.append(inp);
      }
      document.body.append(form);
      form.submit();
    }

    async function pollPaid() {
      toast("支付成功，正在同步…");
      for (let i = 0; i < 4; i++) {
        const me = await loadMe();
        if (me?.active) { toast("会员已开通 ✓", 3000); return; }
        await new Promise(r => setTimeout(r, 1500));
      }
      toast("支付已收到，请稍后刷新");
    }

    function render() {
      const email = localStorage.getItem("email");
      const session = localStorage.getItem("session");
      $("login").hidden = !!email;
      $("me").hidden = !email;
      $("who").textContent = email || "";
      $("alias").textContent = email ? `${email.replace("@", "--")}@buyai.win` : "";
      if (email && session) {
        loadMe();
        loadMails();
        if (sessionStorage.getItem("sso")) finishSso(session);
      }
    }

    // events
    $("login").onsubmit = async e => {
      e.preventDefault();
      toast("发送中…");
      const r = await post("/send", { email: $("email").value });
      toast(r.ok ? "已发送，请查收邮箱" : r.error);
    };
    $("payOnce").onclick = () => pay("once");
    $("payMonth").onclick = () => pay("month");
    $("portal").onclick = async () => {
      toast("正在打开…");
      const r = await post("/portal", { session: localStorage.getItem("session") });
      if (r.url) location.href = r.url;
      else toast(r.error || "无法打开");
    };
    $("alias").onclick = () => navigator.clipboard.writeText($("alias").textContent).then(() => toast("已复制 ✓", 2000));
    $("refresh").onclick = () => { loadMe(); loadMails(); };
    $("logout").onclick = () => { localStorage.clear(); sessionStorage.clear(); $("mails").replaceChildren(); $("msg").textContent = ""; render(); };

    // init
    const hash = new URLSearchParams(location.hash.slice(1));
    const token = hash.get("token");
    if (hash.has("sso")) {
      sessionStorage.setItem("sso", JSON.stringify({ reqId: hash.get("sso") || "", relay: hash.get("relay") || "" }));
      history.replaceState(null, "", location.pathname + location.search);
    }
    const paid = new URLSearchParams(location.search).get("paid");
    if (paid) history.replaceState(null, "", "/");

    if (token) {
      history.replaceState(null, "", "/");
      post("/verify", { token }).then(r => {
        if (r.session) {
          localStorage.setItem("session", r.session);
          localStorage.setItem("email", r.email);
          toast("登录成功 ✓", 3000);
        } else {
          toast(r.error);
        }
        render();
      });
    } else {
      render();
      if (paid && localStorage.getItem("session")) pollPaid();
    }
  </script>
</body>
</html>
