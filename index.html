<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Transfer</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      --bg: #f5f6f8;
      --surface: #fff;
      --surface-2: #f7f8fa;
      --line: #e5e8ed;
      --line-strong: #cfd5de;
      --text: #181b20;
      --text-2: #545c69;
      --text-3: #66707d;
      --brand: #2563eb;
      --brand-hover: #1d4ed8;
      --brand-soft: #eef4ff;
      --brand-line: #bcd2ff;
      --ok: #0d7a55;
      --ok-soft: #eaf7f1;
      --ok-line: #bfe4d2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 保证 hidden 不被组件自身的 display 覆盖 */
    [hidden] { display: none !important; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px 22px;
      box-shadow: 0 8px 30px rgba(24, 27, 32, .05);
    }

    /* 头部 */
    .brand { text-align: center; margin-bottom: 24px; }
    .brand h1 { font-size: 19px; font-weight: 600; letter-spacing: -.3px; }
    .brand p { font-size: 12px; color: var(--text-3); margin-top: 4px; }

    /* 通用排版 */
    .label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
    .hint { font-size: 12px; color: var(--text-3); line-height: 1.55; }
    .center { text-align: center; }
    .mt-sm { margin-top: 8px; }
    .mt-md { margin-top: 16px; }
    .divider { height: 1px; background: var(--line); margin: 20px 0 8px; }
    .msg { font-size: 13px; color: var(--text-2); min-height: 1.4em; margin-top: 16px; text-align: center; }

    /* 输入 */
    input[type="email"] {
      width: 100%;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      padding: 11px 13px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: var(--text-3); }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

    /* 按钮：只有三级 —— 主行动 / 次行动 / 文字链接 */
    .btn {
      display: block;
      width: 100%;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      padding: 11px 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color .15s, border-color .15s, color .15s;
    }
    .btn:focus-visible, .plan-card:focus-visible, .account-value:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--brand-hover); }
    .btn-secondary { background: var(--surface); color: var(--text-2); border-color: var(--line-strong); }
    .btn-secondary:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
    .btn-link { background: transparent; color: var(--text-3); font-size: 13px; font-weight: 500; padding: 8px; }
    .btn-link:hover { color: var(--brand); }

    /* 状态徽标 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid var(--line);
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge-inactive { background: var(--surface-2); color: var(--text-3); }
    .badge-active { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }

    .user-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .user-email {
      font-size: 13px;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 统一信息块：全站只有这一种卡片 */
    .panel {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .panel-title::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .panel-text { font-size: 13px; color: var(--text-2); word-break: break-all; }
    .panel-text strong { color: var(--text); font-weight: 600; }
    .panel-note { font-size: 12px; color: var(--text-3); line-height: 1.6; margin-top: 8px; }

    /* 方案选择：竖排，选中态一眼可辨 */
    .plan-list { display: flex; flex-direction: column; gap: 8px; }
    .plan-card {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      font-family: var(--font);
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: border-color .15s, background-color .15s;
    }
    .plan-card:hover { border-color: var(--brand-line); }
    .plan-card.active { background: var(--brand-soft); border-color: var(--brand); }
    .plan-radio {
      flex: none;
      position: relative;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--line-strong);
      border-radius: 50%;
      background: var(--surface);
    }
    .plan-card.active .plan-radio { border-color: var(--brand); }
    .plan-card.active .plan-radio::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--brand);
    }
    .plan-copy { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .plan-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .plan-note { font-size: 12px; color: var(--text-3); }
    .plan-price { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .plan-card.active .plan-price { color: var(--brand-hover); }
    .plan-price small { font-size: 12px; font-weight: 500; color: var(--text-3); }

    /* 已开通 */
    .valid-info { font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
    .account-value {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      color: var(--text);
      word-break: break-all;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .account-value:hover { border-color: var(--brand-line); }
    .account-value::after {
      content: "复制";
      flex: none;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      color: var(--brand);
    }
    .steps { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .guide-list { padding-left: 18px; font-size: 12px; color: var(--text-3); line-height: 1.7; }
    .guide-list li { margin-bottom: 2px; }
    .guide-list strong { color: var(--text-2); font-weight: 600; }

    @media (max-width: 420px) {
      main { padding: 24px 18px 18px; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <h1>Transfer</h1>
      <p>Claude 账户自助开通</p>
    </header>

    <!-- 登录模块 -->
    <div id="loginSection">
      <form id="login">
        <label class="label" for="email">邮箱地址</label>
        <input type="email" id="email" placeholder="you@example.com" required autofocus>
        <button id="btnSend" class="btn btn-primary mt-md" type="submit">发送登录链接</button>
        <p class="hint center mt-sm">验证邮件中的链接 10 分钟内有效，无需密码</p>
      </form>

      <!-- 发送成功 -->
      <div id="loginSent" hidden>
        <div class="panel">
          <div class="panel-title">登录邮件已发送</div>
          <p class="panel-text">已发送至 <strong id="sentEmail"></strong></p>
          <p class="panel-note">打开邮件点击链接即可完成登录；没收到请检查垃圾邮件。</p>
        </div>
        <button id="btnResend" class="btn btn-secondary mt-md" type="button" disabled>重新发送邮件 (60s)</button>
        <button id="btnBackToLogin" class="btn btn-link" type="button">更换邮箱</button>
      </div>
    </div>

    <!-- 会员看板 -->
    <div id="me" hidden>
      <div class="user-header">
        <span class="user-email" id="who"></span>
        <span id="statusBadge" class="badge badge-inactive">未开通</span>
      </div>

      <!-- 未开通：购买区域 -->
      <div id="pricingSection">
        <p class="label">选择开通方式</p>
        <div class="plan-list">
          <button id="planOnce" type="button" class="plan-card active" aria-pressed="true">
            <span class="plan-radio" aria-hidden="true"></span>
            <span class="plan-copy">
              <span class="plan-name">30 天使用权限</span>
              <span class="plan-note">一次性付款，到期不自动续费</span>
            </span>
            <span class="plan-price">$35</span>
          </button>
          <button id="planMonth" type="button" class="plan-card" aria-pressed="false">
            <span class="plan-radio" aria-hidden="true"></span>
            <span class="plan-copy">
              <span class="plan-name">按月自动续费</span>
              <span class="plan-note">可随时取消</span>
            </span>
            <span class="plan-price">$35<small>/月</small></span>
          </button>
        </div>
        <button id="btnPay" class="btn btn-primary mt-md" type="button">付款 $35 · 开通 30 天</button>
        <p class="hint center mt-sm">付款成功后立即生成专属账号</p>
      </div>

      <!-- 已开通：交付区域 -->
      <div id="activeSection" hidden>
        <p id="validUntil" class="valid-info"></p>

        <div class="panel">
          <div class="label">您的 Claude 登录名</div>
          <div class="account-value" id="alias" title="点击复制登录名"></div>
        </div>

        <div class="steps">
          <p class="label">如何登录</p>
          <ol class="guide-list">
            <li>点击下方按钮，会自动复制登录名并打开 Claude 官网。</li>
            <li>在官网粘贴登录名即可，<strong>无需密码</strong>。</li>
          </ol>
        </div>

        <a id="btnClaude" class="btn btn-primary mt-md" href="https://claude.ai/login" target="_blank" rel="noopener noreferrer">前往 Claude 官网登录</a>
        <button id="portal" class="btn btn-link mt-sm" type="button" hidden>管理自动续费</button>
      </div>

      <div class="divider"></div>
      <button id="logout" class="btn btn-link" type="button">退出登录</button>
    </div>

    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </main>

  <script>
    const API = "https://api.buyai.win";
    const $ = id => document.getElementById(id);
    const post = (path, body) => fetch(API + path, { method: "POST", body: JSON.stringify(body) }).then(r => r.json());
    const fmtDate = ms => new Date(ms).toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
    const toast = (t, dur = 3000) => {
      $("msg").textContent = t;
      if (dur) setTimeout(() => { if ($("msg").textContent === t) $("msg").textContent = ""; }, dur);
    };

    async function loadMe() {
      const session = localStorage.getItem("session");
      if (!session) return null;
      const r = await post("/me", { session });
      if (r.error) return null;

      $("alias").textContent = r.alias;

      if (r.active) {
        $("statusBadge").textContent = "已开通";
        $("statusBadge").className = "badge badge-active";
        $("validUntil").textContent = `会员有效期至 ${fmtDate(r.until)}`;
        $("pricingSection").hidden = true;
        $("activeSection").hidden = false;
        $("portal").hidden = !r.hasSub;
      } else {
        $("statusBadge").textContent = "未开通";
        $("statusBadge").className = "badge badge-inactive";
        $("pricingSection").hidden = false;
        $("activeSection").hidden = true;
      }
      return r;
    }

    async function pay(plan) {
      toast("正在前往收银台…", 0);
      const r = await post("/pay", { session: localStorage.getItem("session"), plan });
      if (r.url) location.href = r.url;
      else toast(r.error || "创建支付失败，请稍后再试");
    }

    async function finishSso(session) {
      const raw = sessionStorage.getItem("sso");
      if (!raw) return;
      const sso = JSON.parse(raw);
      toast("正在为您登录 Claude 官网…", 0);
      const r = await post("/sso/assert", { session, reqId: sso.reqId, relay: sso.relay });
      if (!r.samlResponse) {
        if (!r.needPay) sessionStorage.removeItem("sso");
        toast(r.error || "登录授权失败，请重试");
        return;
      }
      sessionStorage.removeItem("sso");
      const form = document.createElement("form");
      form.method = "POST";
      form.action = r.acs;
      for (const [k, v] of [["SAMLResponse", r.samlResponse], ["RelayState", r.relay]]) {
        const inp = document.createElement("input");
        inp.type = "hidden";
        inp.name = k;
        inp.value = v;
        form.append(inp);
      }
      document.body.append(form);
      form.submit();
    }

    async function pollPaid() {
      toast("付款成功！正在为您生成专属账号…", 0);
      for (let i = 0; i < 5; i++) {
        const me = await loadMe();
        if (me?.active) {
          toast("开通成功！专属账号已生成，请在下方查看", 4000);
          return;
        }
        await new Promise(r => setTimeout(r, 1500));
      }
      toast("已收到付款，若状态未立即刷新请手动刷新页面");
    }

    function render() {
      const email = localStorage.getItem("email");
      const session = localStorage.getItem("session");
      $("loginSection").hidden = !!email;
      $("me").hidden = !email;
      $("who").textContent = email || "";
      if (email && session) {
        loadMe();
        if (sessionStorage.getItem("sso")) finishSso(session);
      }
    }

    // 登录与重发逻辑
    let timerId = null;
    function startCountdown() {
      let remain = 60;
      $("btnResend").disabled = true;
      $("btnResend").textContent = `重新发送邮件 (${remain}s)`;
      if (timerId) clearInterval(timerId);
      timerId = setInterval(() => {
        remain--;
        if (remain <= 0) {
          clearInterval(timerId);
          timerId = null;
          $("btnResend").disabled = false;
          $("btnResend").textContent = "重新发送邮件";
        } else {
          $("btnResend").textContent = `重新发送邮件 (${remain}s)`;
        }
      }, 1000);
    }

    async function doSend(email) {
      $("btnSend").disabled = true;
      $("btnSend").textContent = "发送中…";
      const r = await post("/send", { email });
      $("btnSend").disabled = false;
      $("btnSend").textContent = "发送登录链接";
      if (r.ok) {
        $("sentEmail").textContent = email;
        $("login").hidden = true;
        $("loginSent").hidden = false;
        startCountdown();
      } else {
        toast(r.error || "发送失败，请稍后重试", 4000);
      }
    }

    $("login").onsubmit = e => {
      e.preventDefault();
      const email = $("email").value.trim();
      if (email) doSend(email);
    };

    $("btnResend").onclick = () => {
      const email = $("sentEmail").textContent;
      if (email) doSend(email);
    };

    $("btnBackToLogin").onclick = () => {
      if (timerId) { clearInterval(timerId); timerId = null; }
      $("login").hidden = false;
      $("loginSent").hidden = true;
    };

    // 方案选择与付款
    let selectedPlan = "once";
    const payText = { once: "付款 $35 · 开通 30 天", month: "付款 $35/月 · 自动续费" };
    function selectPlan(plan) {
      selectedPlan = plan;
      for (const [id, key] of [["planOnce", "once"], ["planMonth", "month"]]) {
        const on = key === plan;
        $(id).classList.toggle("active", on);
        $(id).setAttribute("aria-pressed", String(on));
      }
      $("btnPay").textContent = payText[plan];
    }
    $("planOnce").onclick = () => selectPlan("once");
    $("planMonth").onclick = () => selectPlan("month");
    $("btnPay").onclick = () => pay(selectedPlan);

    $("portal").onclick = async () => {
      toast("正在打开订阅管理…", 0);
      const r = await post("/portal", { session: localStorage.getItem("session") });
      if (r.url) location.href = r.url;
      else toast(r.error || "无法打开订阅管理");
    };

    $("alias").onclick = () => {
      navigator.clipboard.writeText($("alias").textContent).then(() => toast("账号已复制，去官网粘贴即可", 2500));
    };

    $("btnClaude").onclick = () => {
      if ($("alias").textContent) {
        navigator.clipboard.writeText($("alias").textContent).then(() => {
          toast("已自动复制您的登录名，正在前往 Claude 官网…", 2500);
        });
      }
    };

    $("logout").onclick = () => {
      localStorage.clear();
      sessionStorage.clear();
      if (timerId) { clearInterval(timerId); timerId = null; }
      $("login").hidden = false;
      $("loginSent").hidden = true;
      $("msg").textContent = "";
      render();
    };

    // 初始化路由参数
    const hash = new URLSearchParams(location.hash.slice(1));
    const token = hash.get("token");
    if (hash.has("sso")) {
      sessionStorage.setItem("sso", JSON.stringify({ reqId: hash.get("sso") || "", relay: hash.get("relay") || "" }));
      history.replaceState(null, "", location.pathname + location.search);
    }
    const paid = new URLSearchParams(location.search).get("paid");
    if (paid) history.replaceState(null, "", "/");

    if (token) {
      history.replaceState(null, "", "/");
      post("/verify", { token }).then(r => {
        if (r.session) {
          localStorage.setItem("session", r.session);
          localStorage.setItem("email", r.email);
          toast("登录成功", 2000);
        } else {
          toast(r.error || "登录失败");
        }
        render();
      });
    } else {
      render();
      if (paid && localStorage.getItem("session")) pollPaid();
    }
  </script>
</body>
</html>
